plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eymen.pillog'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eymen.pillog'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Kolay kurulum için release de debug anahtarıyla imzalanır.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
